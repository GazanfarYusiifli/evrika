<!DOCTYPE html>
<html>
<head>
  <title>Test Translate</title>
    <meta name="description" content="Evrika – gələcəyin liderlərini yetişdirən müasir təhsil ekosistemi.">
</head>
<body>
  <div id="google_translate_element" style="display:none;"></div>
  <h1>Salam Dünya</h1>
  <p>Bu bir sınaqdır.</p>
  <button onclick="changeLanguage('en')">EN</button>
  <button onclick="changeLanguage('ru')">RU</button>
  <button onclick="changeLanguage('az')">AZ</button>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'az', includedLanguages: 'az,en,ru', autoDisplay: false}, 'google_translate_element');
    }
    
    function changeLanguage(lang) {
      var select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = lang;
        select.dispatchEvent(new Event('change'));
      }
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- Whelp Widget Code -->
<script src="https://widget.whelp.co/app.js"></script>
<script type="text/javascript">
	Whelp("init", {
		app_id: "6880c82727fd01e5dc2bdcc4f78237cb"
	});
	// Mobil ekranda avtomatik açılmanın qarşısını almaq üçün (JS üsulu)
	if (window.innerWidth < 768) {
		let wCount = 0;
		let wTimer = setInterval(() => {
			if (typeof Whelp === 'function') { Whelp('close'); }
			if (++wCount > 10) clearInterval(wTimer);
		}, 500);
	}
</script>
<!-- Whelp Widget Code -->

</body>
</html>
