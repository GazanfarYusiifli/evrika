<!DOCTYPE html>
<html>
<head>
  <title>Test Translate</title>
    <meta name="description" content="Evrika – gələcəyin liderlərini yetişdirən müasir təhsil ekosistemi.">
</head>
<body>
  <div id="google_translate_element" style="display:none;"></div>
  <h1>Salam Dünya</h1>
  <p>Bu bir sınaqdır.</p>
  <button onclick="changeLanguage('en')">EN</button>
  <button onclick="changeLanguage('ru')">RU</button>
  <button onclick="changeLanguage('az')">AZ</button>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'az', includedLanguages: 'az,en,ru', autoDisplay: false}, 'google_translate_element');
    }
    
    function changeLanguage(lang) {
      var select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = lang;
        select.dispatchEvent(new Event('change'));
      }
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- Whelp Widget Code -->
<script src="https://widget.whelp.co/app.js"></script>
<script type="text/javascript">
	Whelp("init", {
		app_id: "fdbc088cd36f5d0531bd6672933d00b2"
	});
	
	// Ensure Whelp doesn't auto open on mobile by intercepting its state
	if (window.innerWidth <= 768) {
	    // Poll and force close if it opens automatically without user interaction
	    let userClicked = false;
	    window.addEventListener('touchstart', (e) => { userClicked = true; }, {once: true});
	    let wTimer = setInterval(() => {
	        if (!userClicked && typeof Whelp === 'function') {
	            try { Whelp('close'); } catch(e) {}
	        } else if (userClicked) {
	            clearInterval(wTimer);
	        }
	    }, 300);
	    setTimeout(() => clearInterval(wTimer), 8000);
	}
</script>
<!-- Whelp Widget Code -->

</body>
</html>
