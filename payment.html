<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Təhlükəsiz Ödəniş Portalı | EVRİKA</title>
  <link rel="icon" href="/assets/loqoYeni.PNG" type="image/png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #8b1a2b;
      --primary-glow: rgba(139, 26, 43, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      overflow-x: hidden;
      position: relative;
    }

    .aurora-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.28;
    }
    .orb-1 { width: 450px; height: 450px; background: radial-gradient(circle, #8b1a2b 0%, #4c0519 70%); top: -100px; left: -100px; }
    .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, #1e3a8a 0%, #0f172a 70%); bottom: -120px; right: -120px; }

    .laser-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .main-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .brand-crest {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      backdrop-filter: blur(20px);
    }
    .brand-crest img { width: 32px; height: 32px; object-fit: contain; }
    .brand-crest span { font-size: 0.85rem; font-weight: 800; letter-spacing: 2px; color: #cbd5e1; text-transform: uppercase; }

    .pay-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 36px 30px;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      box-shadow: 0 30px 70px -15px rgba(0,0,0,0.7);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .pay-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #8b1a2b, #e11d48, #3b82f6);
    }

    .pay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
    }

    .amount-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .amount-box p {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
    }
    .amount-box h2 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #10b981;
      letter-spacing: -1px;
    }

    .input-grp {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-grp label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
    }
    .custom-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
    }
    .custom-input:focus {
      border-color: rgba(225, 29, 72, 0.6);
      box-shadow: 0 0 15px rgba(225, 29, 72, 0.2);
    }

    .pay-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #8b1a2b, #b91c1c);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(139, 26, 43, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(139, 26, 43, 0.6);
    }
    .pay-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="aurora-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="laser-grid"></div>

  <div class="main-wrap">
    <div class="brand-crest">
      <img decoding="async" src="/assets/loqoYeni.PNG" alt="Evrika" />
      <span>Evrika Təhsil Ekosistemi</span>
    </div>

    <div class="pay-card">
      <div class="pay-header">
        <h4 style="font-weight: 900; font-size: 1.1rem; color:#fff; display:flex; align-items:center; gap:8px;">
          <i class="fas fa-lock" style="color:#10b981;"></i> EPOINT SECURE
        </h4>
        <div style="display: flex; gap: 10px; align-items:center;">
          <img decoding="async" src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" style="height: 20px;" alt="Mastercard">
          <img decoding="async" src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" style="height: 14px;" alt="Visa">
        </div>
      </div>

      <div class="amount-box">
        <p id="payment-purpose">İmtahana Giriş Kuponu</p>
        <h2 id="amount-display">35.00 AZN</h2>
        <div id="student-info-tag" style="margin-top: 6px; font-size: 0.85rem; color: #38bdf8; font-weight: 700;"></div>
      </div>

      <!-- Fallback fields if no regId is passed -->
      <div id="extra-fields" style="display: none; flex-direction: column; gap: 14px;">
        <div class="input-grp">
          <label>Şagirdin Adı və Soyadı *</label>
          <input type="text" id="manual_name" class="custom-input" placeholder="Məsələn: Əli Məmmədov">
        </div>
        <div class="input-grp">
          <label>Şagirdin Sinfi *</label>
          <select id="manual_grade" class="custom-input" style="background: #0f172a; cursor: pointer;" onchange="handleManualGradeChange(this.value)">
            <option value="Məktəbəqədər">Məktəbəqədər (25 AZN)</option>
            <option value="I sinif">I sinif (35 AZN)</option>
            <option value="II sinif">II sinif (35 AZN)</option>
            <option value="III sinif">III sinif (35 AZN)</option>
            <option value="IV sinif">IV sinif (35 AZN)</option>
            <option value="V sinif" selected>V sinif (35 AZN)</option>
            <option value="VI sinif">VI sinif (35 AZN)</option>
            <option value="VII sinif">VII sinif (35 AZN)</option>
            <option value="VIII sinif">VIII sinif (35 AZN)</option>
            <option value="IX sinif">IX sinif (35 AZN)</option>
            <option value="X sinif">X sinif (35 AZN)</option>
            <option value="XI sinif">XI sinif (35 AZN)</option>
          </select>
        </div>
        <div class="input-grp">
          <label>Əlaqə Nömrəsi *</label>
          <input type="tel" id="manual_phone" class="custom-input" placeholder="050 123 45 67">
        </div>
        <div class="input-grp">
          <label>Valideyn E-mail (Kuponun göndərilməsi üçün)</label>
          <input type="email" id="manual_email" class="custom-input" placeholder="valideyn@example.com">
        </div>
      </div>

      <button type="button" class="pay-btn" id="paySubmitBtn" onclick="processPayment()">
        <i class="fas fa-credit-card"></i> KARTLA ÖDƏNİŞƏ KEÇ
      </button>

      <p style="text-align:center; font-size: 0.75rem; color: rgba(255,255,255,0.4);">
        <i class="fas fa-shield-alt"></i> PashaBank & Epoint 3D-Secure ilə tam qorunur
      </p>
    </div>
  </div>

  <script>
    const API_BASE = 'https://evrika-api.yusifliqezenfer90.workers.dev';
    const urlParams = new URLSearchParams(window.location.search);
    let regId = urlParams.get('id') || urlParams.get('regId') || localStorage.getItem('last_regId') || '';
    let regName = urlParams.get('name') || localStorage.getItem('last_name') || '';
    let emailParam = urlParams.get('email') || localStorage.getItem('last_email') || '';
    let autostart = urlParams.get('autostart') === '1';

    let isSubmitting = false;

    function handleManualGradeChange(val) {
      const amt = (val === 'Məktəbəqədər' || val === 'Məktəbə qədər') ? 25 : 35;
      document.getElementById('amount-display').innerText = amt.toFixed(2) + ' AZN';
    }

    async function loadStudentDataIfAvailable() {
      if (!regId) {
        document.getElementById('extra-fields').style.display = 'flex';
        return;
      }

      const cleanDbId = parseInt(String(regId).replace(/\D/g, ''), 10);
      if (!cleanDbId) {
        document.getElementById('extra-fields').style.display = 'flex';
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/payment-status?id=${cleanDbId}`, { cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          if (json && json.data) {
            const d = json.data;
            regName = d.student_name || regName;
            document.getElementById('student-info-tag').innerText = "Şagird: " + regName + (d.grade ? ` (${d.grade})` : '');
            document.getElementById('amount-display').innerText = (d.amount || 0.01).toFixed(2) + ' AZN';

            if (d.isPaid || d.status === 'PAID') {
              document.getElementById('student-info-tag').innerHTML = `<span style="color:#10b981; font-weight:800;"><i class="fas fa-check-circle"></i> Bu qeydiyyat üzrə ödəniş artıq təsdiqlənib</span>`;
              const btn = document.getElementById('paySubmitBtn');
              btn.innerHTML = '<i class="fas fa-id-card"></i> KUPONA BAX / YÜKLƏ';
              btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
              btn.onclick = () => window.location.href = `/success?regId=${cleanDbId}`;
              return;
            }
          }
        }
      } catch (err) {
        console.warn("Status check warning:", err);
      }

      if (autostart) {
        processPayment();
      }
    }

    loadStudentDataIfAvailable();

    async function processPayment() {
      if (isSubmitting) return;

      const btn = document.getElementById('paySubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> BAĞLANTI QURULUR...';
      isSubmitting = true;

      let finalDbId = regId;
      let finalName = regName;
      let finalEmail = emailParam;

      if (!finalDbId) {
        finalName = document.getElementById('manual_name').value.trim();
        const phoneVal = document.getElementById('manual_phone').value.trim();
        const gradeVal = document.getElementById('manual_grade').value;
        finalEmail = document.getElementById('manual_email').value.trim();

        if (!finalName || !phoneVal) {
          alert('Zəhmət olmasa şagirdin adını və əlaqə nömrəsini daxil edin.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-credit-card"></i> KARTLA ÖDƏNİŞƏ KEÇ';
          isSubmitting = false;
          return;
        }

        try {
          const createRes = await fetch(`${API_BASE}/api/registrations`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fullName: finalName,
              student_name: finalName,
              student_grade: gradeVal,
              phone: phoneVal,
              email: finalEmail,
              source: 'Birbaşa Ödəniş Portalı',
              status: 'Yeni',
              payment_status: 'Ödənilməyib',
              amount: '0.01',
              date: new Date().toISOString()
            })
          });

          if (createRes.ok) {
            const data = await createRes.json();
            if (data && data.id) {
              finalDbId = data.id;
            }
          }
        } catch(e) {
          console.error("Auto registration error:", e);
        }
      }

      const cleanDbId = finalDbId ? parseInt(String(finalDbId).replace(/\D/g, ''), 10) : null;
      if (!cleanDbId) {
        alert('Qeydiyyat ID tapılmadı.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-credit-card"></i> KARTLA ÖDƏNİŞƏ KEÇ';
        isSubmitting = false;
        return;
      }

      try {
        btn.innerHTML = '<i class="fas fa-lock"></i> TƏHLÜKƏSİZ ÖDƏNİŞƏ YÖNLƏNDİRİLİRSİNİZ...';

        const response = await fetch(`${API_BASE}/api/epoint-pay`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            regId: cleanDbId,
            name: finalName,
            email: finalEmail
          })
        });

        const resData = await response.json();

        if (resData.already_paid) {
          window.location.href = `/success?regId=${cleanDbId}`;
          return;
        }

        if (resData.success && resData.redirect_url) {
          localStorage.setItem('last_regId', cleanDbId);
          localStorage.setItem('last_email', finalEmail);
          localStorage.setItem('last_name', finalName);
          localStorage.setItem('last_order_id', resData.order_number);
          
          btn.innerHTML = '<i class="fas fa-check"></i> EPOINT ÇEKOUT AÇILIR...';
          window.location.href = resData.redirect_url;
        } else {
          const errMsg = (resData.error && resData.error.message) || resData.message || 'Ödəniş sessiyası yaradıla bilmədi.';
          alert('Xəta: ' + errMsg);
          btn.innerHTML = 'YENİDƏN CƏHD ET';
          btn.disabled = false;
          isSubmitting = false;
        }
      } catch (err) {
        console.error('Payment error:', err);
        alert('Serverlə əlaqə qurulmadı. İnternet bağlantınızı yoxlayın.');
        btn.innerHTML = '<i class="fas fa-credit-card"></i> KARTLA ÖDƏNİŞƏ KEÇ';
        btn.disabled = false;
        isSubmitting = false;
      }
    }
  </script>
</body>
</html>
