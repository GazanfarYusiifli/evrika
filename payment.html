<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Təhlükəsiz Ödəniş Portalı | EVRİKA</title>
  <link rel="icon" href="/assets/loqoYeni.PNG" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(15, 23, 42, 0.8);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #8b1a2b;
      --primary-glow: rgba(139, 26, 43, 0.45);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      overflow-x: hidden;
      position: relative;
    }

    .aurora-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.28;
    }
    .orb-1 { width: 450px; height: 450px; background: radial-gradient(circle, #8b1a2b 0%, #4c0519 70%); top: -100px; left: -100px; }
    .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, #3b82f6 0%, #1e40af 70%); bottom: -120px; right: -120px; }

    .laser-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .main-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .brand-crest {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      backdrop-filter: blur(20px);
    }
    .brand-crest img { width: 32px; height: 32px; object-fit: contain; }
    .brand-crest span { font-size: 0.85rem; font-weight: 800; letter-spacing: 2px; color: #cbd5e1; text-transform: uppercase; }

    .pay-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 36px 30px;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      box-shadow: 0 30px 70px -15px rgba(0,0,0,0.7);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .pay-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #8b1a2b, #e11d48, #3b82f6);
    }

    .pay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
    }

    .amount-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .amount-box p {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
    }
    .amount-box h2 {
      font-size: 2.4rem;
      font-weight: 900;
      color: #fff;
    }

    .input-grp {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-grp label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #cbd5e1;
    }
    .custom-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
    }
    .custom-input:focus {
      border-color: rgba(225, 29, 72, 0.6);
      box-shadow: 0 0 15px rgba(225, 29, 72, 0.2);
    }

    .pay-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #8b1a2b, #b91c1c);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(139, 26, 43, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(139, 26, 43, 0.6);
    }
    .pay-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="aurora-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="laser-grid"></div>

  <div class="main-wrap">
    <div class="brand-crest">
      <img src="/assets/loqoYeni.PNG" alt="Evrika" />
      <span>Evrika Təhsil Ekosistemi</span>
    </div>

    <div class="pay-card">
      <div class="pay-header">
        <h4 style="font-weight: 900; font-size: 1.1rem; color:#fff; display:flex; align-items:center; gap:8px;">
          <i class="fas fa-lock" style="color:#10b981;"></i> EPOINT SECURE
        </h4>
        <div style="display: flex; gap: 10px; align-items:center;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" style="height: 20px;" alt="Mastercard">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" style="height: 14px;" alt="Visa">
        </div>
      </div>

      <div class="amount-box">
        <p id="payment-purpose">İmtahana Giriş Kuponu</p>
        <h2 id="amount-display">0.01 AZN</h2>
        <div id="student-info-tag" style="margin-top: 6px; font-size: 0.85rem; color: #38bdf8; font-weight: 700;"></div>
      </div>

      <!-- Fallback fields if no regId is passed -->
      <div id="extra-fields" style="display: none; flex-direction: column; gap: 14px;">
        <div class="input-grp">
          <label>Şagirdin Adı və Soyadı *</label>
          <input type="text" id="manual_name" class="custom-input" placeholder="Məsələn: Əli Məmmədov">
        </div>
        <div class="input-grp">
          <label>Şagirdin Sinfi *</label>
          <select id="manual_grade" class="custom-input" style="background: #0f172a; cursor: pointer;" onchange="handleGradeChange(this.value)">
            <option value="Məktəbəqədər">Məktəbəqədər (0.01 AZN - Test)</option>
            <option value="I sinif">I sinif (0.01 AZN - Test)</option>
            <option value="II sinif">II sinif (0.01 AZN - Test)</option>
            <option value="III sinif">III sinif (0.01 AZN - Test)</option>
            <option value="IV sinif">IV sinif (0.01 AZN - Test)</option>
            <option value="V sinif" selected>V sinif (0.01 AZN - Test)</option>
            <option value="VI sinif">VI sinif (0.01 AZN - Test)</option>
            <option value="VII sinif">VII sinif (0.01 AZN - Test)</option>
            <option value="VIII sinif">VIII sinif (0.01 AZN - Test)</option>
            <option value="IX sinif">IX sinif (0.01 AZN - Test)</option>
            <option value="X sinif">X sinif (0.01 AZN - Test)</option>
            <option value="XI sinif">XI sinif (0.01 AZN - Test)</option>
          </select>
        </div>
        <div class="input-grp">
          <label>Əlaqə Nömrəsi *</label>
          <input type="tel" id="manual_phone" class="custom-input" placeholder="050 123 45 67">
        </div>
        <div class="input-grp">
          <label>Valideyn E-mail (Kuponun göndərilməsi üçün)</label>
          <input type="email" id="manual_email" class="custom-input" placeholder="valideyn@example.com">
        </div>
      </div>

      <button type="button" class="pay-btn" id="paySubmitBtn" onclick="processPayment()">
        <i class="fas fa-credit-card"></i> KARTLA ÖDƏNİŞƏ KEÇ
      </button>

      <p style="text-align:center; font-size: 0.75rem; color: rgba(255,255,255,0.4);">
        <i class="fas fa-shield-alt"></i> PashaBank & Epoint 3D-Secure ilə tam qorunur
      </p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let regId = urlParams.get('id') || urlParams.get('regId');
    let regName = urlParams.get('name') || '';
    let amountParam = urlParams.get('amount') || '0.01';
    let emailParam = urlParams.get('email') || '';
    let gradeParam = urlParams.get('grade') || '';

    // Test rejimi üçün 0.01 AZN
    amountParam = '0.01';

    document.getElementById('amount-display').innerText = parseFloat(amountParam).toFixed(2) + ' AZN';

    if (regName) {
      document.getElementById('student-info-tag').innerText = "Şagird: " + regName;
    }

    if (!regId) {
      document.getElementById('extra-fields').style.display = 'flex';
    }

    function handleGradeChange(val) {
      amountParam = '0.01';
      document.getElementById('amount-display').innerText = parseFloat(amountParam).toFixed(2) + ' AZN';
    }

    async function processPayment() {
      const btn = document.getElementById('paySubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> BAĞLANTI QURULUR...';

      let finalDbId = regId;
      let finalName = regName;
      let finalEmail = emailParam;

      if (!finalDbId) {
        finalName = document.getElementById('manual_name').value.trim();
        const phoneVal = document.getElementById('manual_phone').value.trim();
        const gradeVal = document.getElementById('manual_grade').value;
        finalEmail = document.getElementById('manual_email').value.trim();

        if (!finalName || !phoneVal) {
          alert('Zəhmət olmasa şagirdin adını və əlaqə nömrəsini daxil edin.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-credit-card"></i> KARTLA ÖDƏNİŞƏ KEÇ';
          return;
        }

        try {
          const createRes = await fetch('https://osicmnagzeqkhwticiqp.supabase.co/rest/v1/registrations', {
            method: 'POST',
            headers: {
              'apikey': 'sb_publishable_wePNIkpZ6n6dMLud4ODjAA_O9nxbkRE',
              'Authorization': 'Bearer sb_publishable_wePNIkpZ6n6dMLud4ODjAA_O9nxbkRE',
              'Content-Type': 'application/json',
              'Prefer': 'return=representation'
            },
            body: JSON.stringify({
              payload: {
                fullName: finalName,
                student_name: finalName,
                student_grade: gradeVal,
                phone: phoneVal,
                email: finalEmail,
                source: 'Birbaşa Ödəniş Portalı',
                status: 'Yeni',
                payment_status: 'Ödənilməyib',
                amount: parseFloat(amountParam),
                date: new Date().toISOString()
              }
            })
          });

          if (createRes.ok) {
            const data = await createRes.json();
            if (data && data.length > 0) {
              finalDbId = data[0].id;
            }
          }
        } catch(e) {
          console.error("Auto registration error:", e);
        }
      }

      const cleanDbId = finalDbId ? parseInt(String(finalDbId).replace(/\D/g, ''), 10) : Math.floor(1000 + Math.random() * 9000);
      const targetOrderId = "EV-" + String(cleanDbId).padStart(4, '0');

      try {
        const response = await fetch('/api/epoint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: parseFloat(amountParam),
            order_id: targetOrderId,
            description: "Evrika Təhsil Ekosistemi | Şagird: " + (finalName || 'Şagird') + " | Sifariş №: " + targetOrderId,
            regId: cleanDbId,
            email: finalEmail,
            name: finalName
          })
        });

        const data = await response.json();

        if (data.redirect_url) {
          localStorage.setItem('last_regId', cleanDbId);
          localStorage.setItem('last_email', finalEmail);
          localStorage.setItem('last_name', finalName);
          btn.innerHTML = '<i class="fas fa-check"></i> EPOINT-Ə YÖNLƏNDİRİLİR...';
          setTimeout(() => {
            window.location.href = data.redirect_url;
          }, 800);
        } else {
          alert('Xəta baş verdi: ' + (data.message || data.error || 'Server Xətası'));
          btn.innerHTML = 'YENİDƏN CƏHD ET';
          btn.disabled = false;
        }
      } catch (err) {
        console.error('Payment fetch error:', err);
        alert('Serverlə əlaqə qurulmadı. Zəhmət olmasa internet bağlantınızı yoxlayın.');
        btn.innerHTML = '<i class="fas fa-credit-card"></i> KARTLA ÖDƏNİŞƏ KEÇ';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
