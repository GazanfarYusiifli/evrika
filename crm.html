<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="format-detection" content="telephone=no">
  <title>Evrika CRM Dashboard</title>
    <meta name="description" content="Evrika – gələcəyin liderlərini yetişdirən müasir təhsil ekosistemi.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 280px; background-color: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sb-header { padding: 30px; border-bottom: 1px solid var(--border); }
    .sb-header h2 { font-weight: 800; font-size: 1.5rem; letter-spacing: 1px; color: white; display: flex; align-items: center; gap: 10px; }
    .sb-nav { padding: 20px 0; flex: 1; display: flex; flex-direction: column; }
    .sb-link { padding: 15px 30px; display: flex; align-items: center; gap: 15px; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: 0.3s; }
    .sb-link:hover, .sb-link.active { color: white; background: rgba(255,255,255,0.05); border-left: 4px solid var(--accent); }
    
    /* Main Content */
    .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .topbar { height: 80px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 40px; justify-content: space-between; background: var(--bg); position: sticky; top: 0; z-index: 10; }
    .topbar h1 { font-size: 1.25rem; font-weight: 600; }
    
    /* Content Area */
    .content { padding: 40px; }
    
    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--panel); padding: 24px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-title { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 2.5rem; font-weight: 800; }
    
    /* Table */
    .table-wrapper { background: var(--panel); border-radius: 12px; border: 1px solid var(--border); overflow: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 16px 24px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: rgba(0,0,0,0.2); font-weight: 600; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    
    .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .badge.new { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .badge.paid { background: rgba(16, 185, 129, 0.2); color: #10b981; font-weight: 700; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge.pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; font-weight: 700; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge.unpaid { background: rgba(239, 68, 68, 0.15); color: #ef4444; font-weight: 700; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge.failed { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; font-weight: 700; border: 1px solid rgba(148, 163, 184, 0.4); }
    .badge.refunded { background: rgba(59, 130, 246, 0.2); color: #3b82f6; font-weight: 700; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge.cancelled { background: rgba(71, 85, 105, 0.3); color: #94a3b8; font-weight: 700; border: 1px solid rgba(71, 85, 105, 0.5); }
    .btn-view { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.3s; }
    .btn-view:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.3s; margin-left: 10px; }
    
    .empty-state { padding: 60px; text-align: center; color: var(--text-muted); }
    .empty-state i { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal { background: var(--panel); width: 100%; max-width: 900px; max-height: 90vh; border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; transform: translateY(20px); transition: 0.3s; }
    .modal-overlay.active .modal { transform: translateY(0); }
    .modal-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 1.25rem; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    .modal-close:hover { color: white; }
    .modal-body { padding: 24px; overflow-y: auto; display: grid; gap: 20px; }
    
    .data-group { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
    .data-group h4 { margin-bottom: 15px; color: var(--accent); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
    .data-item { display: flex; flex-direction: column; gap: 5px; }
    .data-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .data-value { font-weight: 500; font-size: 0.95rem; word-break: break-all; }

    display: flex !important;

    background: #f8f9fa !important; border: 1px solid rgba(0,0,0,0.1) !important; color: #070d1f !important; border-radius: 10px !important; box-shadow: 0 2px 8px rgba(0,0,0,0.05) !important;
  }

  .modern-floating-nav {
    position: fixed !important;
    background: #ffffff !important;
    top: 0 !important;
    width: 100% !important;
    left: 0 !important;
    right: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03) !important;
    pointer-events: auto !important;
  }

  .modern-floating-nav.nav-hidden {
    transform: translateY(-100%) !important;
  }

  .modern-floating-nav.scrolled {
    transform: translateY(0) !important;
    top: 0 !important;
  }
}

  <!-- Sidebar -->

      <div style="display: flex; align-items: center; gap: 15px;">

        </div>
        <div class="stat-card" style="border-left: 4px solid #10b981;">
          <div class="stat-title" style="color: #10b981;">Ödəniş Edən (Kupon Alan)</div>

          <div class="stat-title" style="color: #f59e0b;">Baxılmayan (Yeni)</div>
          <div class="stat-value" id="new-count" style="color: #f59e0b;">0</div>
        </div>
        <div class="stat-card" style="border-left: 4px solid #3b82f6;">
          <div class="stat-title" style="color: #3b82f6;">Toplanmış Vəsait</div>

  <script>
    // --- BASIC ADMIN AUTH LOCK ---
    // Qeyd: Bu sadəcə interfeys səviyyəsində qorunmadır. Real layihədə backend token verification istifadə olunmalıdır.
    if(sessionStorage.getItem('evrika_admin') !== 'true') {
        const pass = prompt('CRM Panelinə giriş yalnız Adminlər üçündür.\nZəhmət olmasa şifrəni daxil edin:\n(Test üçün şifrə: 12345)');
        if(pass === '12345') {
            sessionStorage.setItem('evrika_admin', 'true');
        } else {
            alert('Yanlış şifrə!');
            window.location.href = 'index.html'; // Ana səhifəyə qaytar
        }
    }

    let rawData = [];

    async function loadData() {
      // 1-ci dərəcə: Həmişə əvvəlcə LocalStorage-dən (yüklədiyimiz bazadan) çəksin ki, RLS (Təhlükəsizlik) problemi varsa da, məlumat itməsin.
      const dataStr = localStorage.getItem('evrika_crm_data');
      if(dataStr) {
        rawData = JSON.parse(dataStr);
      }
      
      // 2-ci dərəcə: Cloudflare D1-dən çəkib üzərinə əlavə etməyə (və ya yeniləməyə) cəhd edir
      try {
          const res = await fetch('https://evrika-api.yusifliqezenfer90.workers.dev/api/registrations');
          
          if(res.ok) {
              const data = await res.json();
              if(data && data.length > 0) {
                  const supabaseData = data.map(row => {
                      const cleaned = row.payload || {};
                      cleaned._db_id_ = row.id; 
                      return cleaned;
                  });
                  // Destruktiv yazılmanı sildim. Yəni Supabase-dən gələn məlumatlarla Locally var olanlar birləşdirilir, üst-üstə yazmır!
                  // Yalnız Supabase-də olub Local-da olmayanları əlavə edirik (ID yoxlayırıq).
                  supabaseData.forEach(sbItem => {
                      const exists = rawData.some(localItem => 
                          (localItem._db_id_ && sbItem._db_id_ && localItem._db_id_ === sbItem._db_id_) ||
                          (localItem.submissionDate && sbItem.submissionDate && localItem.submissionDate === sbItem.submissionDate) ||
                          (localItem.date && sbItem.date && localItem.date === sbItem.date)
                      );
                      if(!exists) rawData.push(sbItem);
                  });
                  // Tarixə görə yenidən düzürük
                  rawData.sort((a,b) => {
                      const dateA = new Date(a.date || a.submissionDate || a.created_at || 0);
                      const dateB = new Date(b.date || b.submissionDate || b.created_at || 0);
                      return dateB - dateA;
                  });
                  localStorage.setItem('evrika_crm_data', JSON.stringify(rawData));
              }
          }
      } catch (e) {
          console.error("API xətası:", e);
      }
      
      renderDashboard();
    }

    function isPaymentReg(item) {
      if (!item) return false;
      if (item.payment_status === 'Ödənilib') return true;
      if (item.is_call || item.chid || item.position) return false;
      const s = String(item.source || item.student_grade || '').toLowerCase();
      if (s === 'contact' || s === 'karyera' || s === 'career' || s.includes('zəng') || s.includes('phone') || s.includes('survey') || s.includes('səsi') || s.includes('sesi') || s.includes('montessori') || s.includes('zumrud') || s.includes('zümrüd')) {
        return false;
      }
      if (s.includes('qeydiyyat') || s.includes('lisey') || s.includes('ptim') || s.includes('ödəniş') || s.includes('odenis') || s.includes('imtahan')) {
        return true;
      }
      const amt = String(item.amount || '').trim();
      return Boolean(amt && !['0', '0.00', '0 azn', '0azn', 'null', 'undefined'].includes(amt.toLowerCase()));
    }

    function renderDashboard() {
      document.getElementById('total-count').innerText = rawData.length;
      
      const todayStr = new Date().toISOString().split('T')[0];
      const todayCount = rawData.filter(item => {
        const d = (item.date || item.submissionDate || item.created_at || '');
        return typeof d === 'string' && d.startsWith(todayStr);
      }).length;
      document.getElementById('today-count').innerText = todayCount;

      const paidItems = rawData.filter(item => {
        const s = String(item.payment_status || '').toLowerCase();
        return s === 'ödənilib' || s === 'paid';
      });
      const paidCount = paidItems.length;
      if (document.getElementById('paid-count')) document.getElementById('paid-count').innerText = paidCount;

      let totalRev = 0;
      paidItems.forEach(item => {
        const amt = parseFloat(String(item.amount || '0').replace(/[^0-9.]/g, ''));
        if (!isNaN(amt)) totalRev += amt;
      });
      if (document.getElementById('total-revenue')) {
        document.getElementById('total-revenue').innerText = totalRev.toFixed(2) + ' AZN';
      }

      const newCount = rawData.filter(item => (item.status || 'Yeni').toLowerCase() === 'yeni').length;
      if (document.getElementById('new-count')) document.getElementById('new-count').innerText = newCount;

      const tbody = document.getElementById('crm-tbody');
      tbody.innerHTML = '';

      if(rawData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><i class="fas fa-folder-open"></i><p>Hələ heç bir müraciət daxil olmayıb.</p></div></td></tr>`;
        return;
      }

      rawData.forEach((item, index) => {
        let sdName = item['[2.Şagird] Adı'];
        let demoName = item['[Demo Qeydiyyat] Ad Soyad'];
        const studentName = item.name || item.fullName || (sdName ? sdName + ' ' + (item['[2.Şagird] Soyadı']||'') : '') || demoName || item['[1.Əlaqə] Valideyn Adı'] || 'Naməlum';
        
        const parentPhone = item.phone || item.tel || item['[1.Əlaqə] Əlaqə Nömrəsi'] || item['[3.Ata] Nömrəsi'] || item['[Demo Qeydiyyat] Telefon Nömrəsi'] || '-';
        const section = item.source || item.student_grade || item['[2.Şagird] Təhsil Növü'] || item['[2.Şagird] Müraciət Bölməsi'] || (item['[Demo Qeydiyyat] Email'] ? 'Demo Müraciət' : '-');
        
        const rawDate = item.date || item.submissionDate || item.created_at || Date.now();
        const dateObj = new Date(rawDate);
        const dateStr = !isNaN(dateObj.getTime()) ? (dateObj.toLocaleDateString('az-AZ') + ' ' + dateObj.toLocaleTimeString('az-AZ', {hour: '2-digit', minute:'2-digit'})) : '-';

        let statusText = item.status || 'Yeni';
        let statusBadgeClass = 'badge new';

        // Multi-State Payment Status Check
        let paymentBadgeHtml = `<span style="color:var(--text-muted); font-size:0.85rem;">-</span>`;
        const pStat = String(item.payment_status || '').toLowerCase();
        if (pStat === 'ödənilib' || pStat === 'paid') {
          paymentBadgeHtml = `<span class="badge paid"><i class="fas fa-check-circle"></i> ÖDƏNİLİB</span>`;
        } else if (pStat === 'gözləyir' || pStat === 'pending') {
          paymentBadgeHtml = `<span class="badge pending"><i class="fas fa-clock"></i> GÖZLƏYİR</span>`;
        } else if (pStat === 'uğursuz' || pStat === 'failed') {
          paymentBadgeHtml = `<span class="badge failed"><i class="fas fa-times"></i> UĞURSUZ</span>`;
        } else if (pStat === 'ləğv edilib' || pStat === 'cancelled') {
          paymentBadgeHtml = `<span class="badge cancelled"><i class="fas fa-ban"></i> LƏĞV EDİLİB</span>`;
        } else if (pStat === 'geri qaytarılıb' || pStat === 'refunded') {
          paymentBadgeHtml = `<span class="badge refunded"><i class="fas fa-undo"></i> GERİ QAYTARILIB</span>`;
        } else if (isPaymentReg(item)) {
          paymentBadgeHtml = `<span class="badge unpaid"><i class="fas fa-exclamation-circle"></i> ÖDƏNİLMƏYİB</span>`;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight: 600;">
            <div>${studentName}</div>
            ${item._db_id_ ? `<div style="font-size:0.75rem; color:var(--text-muted); font-weight:400;">ID: #EV-${String(item._db_id_).padStart(4,'0')}</div>` : ''}
          </td>
          <td>${parentPhone}</td>
          <td><span style="opacity:0.8;">${section}</span></td>
          <td>${paymentBadgeHtml}</td>
          <td style="color: var(--text-muted); font-size:0.9rem;">${dateStr}</td>
          <td><span class="${statusBadgeClass}">${statusText}</span></td>
          <td>
            <button class="btn-view" onclick="viewDetails(${index})"><i class="fas fa-eye"></i> Bax</button>
            <button class="btn-danger" style="background:#dc2626; padding:8px 14px; border-radius:6px; font-weight:600;" onclick="deleteItem(${index})" title="Müraciəti sil"><i class="fas fa-trash-alt"></i> Sil</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.viewDetails = function(index) {
      const item = rawData[index];
      const content = document.getElementById('modal-content');
      content.innerHTML = '';

      // Categorize fields broadly based on keys
      const groups = {
        'Müraciət Məlumatları': {},
        'Şagird Məlumatları': {},
        'Ata / Qəyyum Məlumatları': {},
        'Ana Məlumatları': {},
        'Digər / Əlavə': {}
      };

      for(let key in item) {
        if(['submissionDate', 'status', '_captcha', '_subject', '_template', '_db_id_'].includes(key)) {
          continue; // skip technical stuff
        }
        
        let label = key.replace(/\[.*?\]\s*/, ''); // Remove the prefixes
        let val = item[key] || '-';

        if(key === 'name' || key === 'fullName' || key === 'student_grade' || key.includes('[2.Şagird]')) {
          groups['Şagird Məlumatları'][label] = val;
        } else if(key.includes('[3.Ata]') || key.includes('[1.Əlaqə]')) {
          groups['Ata / Qəyyum Məlumatları'][label] = val;
        } else if(key.includes('[3.Ana]')) {
          groups['Ana Məlumatları'][label] = val;
        } else if(['source', 'date', 'order_id'].includes(key)) {
          groups['Müraciət Məlumatları'][label] = val;
        } else if(['payment_status', 'amount'].includes(key)) {
          const src = item.source || item.student_grade || '';
          const isPayable = /lisey|gənclik|nərimanov|ptim|imtahan|ödəniş|odenis/i.test(src);
          // Only include payment info if it is paid or if the application is actually a payable one
          if (item.payment_status === 'Ödənilib' || isPayable) {
            groups['Müraciət Məlumatları'][label] = val;
          }
        } else {
          groups['Digər / Əlavə'][label] = val;
        }
      }

      for(let g in groups) {
        if(Object.keys(groups[g]).length === 0) continue;
        
        const gridHtml = Object.keys(groups[g]).map(k => `
          <div class="data-item">
            <span class="data-label">${k}</span>
            <span class="data-value">${groups[g][k]}</span>
          </div>
        `).join('');

        content.innerHTML += `
          <div class="data-group">
            <h4>${g}</h4>
            <div class="data-grid">
              ${gridHtml}
            </div>
          </div>
        `;
      }

      // Add Payment Event Timeline if available
      const regDbId = item._db_id_ || item.id;
      if (regDbId) {
        content.innerHTML += `
          <div class="data-group" style="border-color: rgba(59, 130, 246, 0.4);">
            <h4 style="color: #38bdf8;"><i class="fas fa-history"></i> Ödəniş və Audit Tarixçəsi</h4>
            <div id="payment-timeline-${regDbId}" style="font-size:0.85rem; color:#94a3b8;">
              <i class="fas fa-spinner fa-spin"></i> Tarixçə yüklənir...
            </div>
          </div>
        `;

        fetch(`https://evrika-api.yusifliqezenfer90.workers.dev/api/admin/payment-events?registration_id=${regDbId}`)
          .then(r => r.json())
          .then(res => {
            const tlBox = document.getElementById(`payment-timeline-${regDbId}`);
            if (!tlBox) return;
            if (res.events && res.events.length > 0) {
              tlBox.innerHTML = res.events.map(ev => `
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                  <div><strong style="color:#fff;">${ev.event}</strong> <span style="font-size:0.75rem; color:#38bdf8;">(${ev.status || '-'})</span></div>
                  <div style="font-size:0.75rem; color:#64748b;">${ev.created_at || ''}</div>
                </div>
              `).join('');
            } else {
              tlBox.innerHTML = '<span style="color:#64748b;">Hələ qeydə alınmış əməliyyat hadisəsi yoxdur.</span>';
            }
          }).catch(() => {
            const tlBox = document.getElementById(`payment-timeline-${regDbId}`);
            if (tlBox) tlBox.innerHTML = '<span style="color:#64748b;">Tarixçə əlçatan deyil.</span>';
          });
      }

      content.innerHTML += `
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px; padding-top:20px; border-top:1px solid var(--border);">
          <button class="btn-danger" style="padding:10px 20px; font-size:0.9rem; display:inline-flex; align-items:center; gap:8px;" onclick="closeModal(); deleteItem(${index});">
            <i class="fas fa-trash-alt"></i> Bu müraciəti birdəfəlik sil
          </button>
        </div>
      `;
      document.getElementById('detail-modal').classList.add('active');
    }

    window.closeModal = function() {
      document.getElementById('detail-modal').classList.remove('active');
    }

    window.deleteItem = async function(index) {
      if(confirm('Seçilmiş müraciəti API və verilənlər bazasından birdəfəlik silmək istədiyinizə əminsiniz?')) {
        const item = rawData[index];

        // Məlumat Cloudflare D1-dən gəlibsə və ID-si varsa API-yə delete atırıq
        if(item._db_id_ || item.id) {
            const delId = item._db_id_ || item.id;
            try {
                await fetch('https://evrika-api.yusifliqezenfer90.workers.dev/api/registrations?id=' + delId, {
                    method: 'DELETE'
                });
            } catch(e) { console.error("Cloudflare silinmə xətası:", e); }
        }

        rawData.splice(index, 1);
        localStorage.setItem('evrika_crm_data', JSON.stringify(rawData)); // Localı da təmizlə
        renderDashboard();
      }
    }

    // Initialize
    loadData();
  </script>
  <script>
    function toggleLang(btn) {
      const code = document.getElementById('lang-code');
      if (code.textContent === 'AZ') {
        code.textContent = 'EN';
        btn.title = 'Switch to Azerbaijani';
      } else {
        code.textContent = 'AZ';
        btn.title = 'Switch to English';
      }
    }
  </script>

            if (typeof updateContent === 'function') {
                updateContent(localStorage.getItem('evrika-lang') || 'az');
            }
