    <div class="container" style="max-width: 500px;">
        <h2 style="margin-top: 0;">Admin & Filial CRM Şifrələri</h2>
        
        <h4 style="color:#ef4444; margin-bottom:10px; border-bottom:1px solid rgba(239,68,68,0.3); padding-bottom:5px;">Filial CRM Şifrələri</h4>
        <div class="fgroup">
            <label>BÜTÜN CRM (Baş İdarəetmə)</label>
            <input type="text" id="setting-pass-crm" placeholder="crm123">
        </div>
        <div class="fgroup">
            <label>BETL Nərimanov</label>
            <input type="text" id="setting-pass-crm-lisey1" placeholder="nerimanov123">
        </div>
        <div class="fgroup">
            <label>BETL Gənclik</label>
            <input type="text" id="setting-pass-crm-lisey2" placeholder="genclik123">
        </div>
        <div class="fgroup">
            <label>Montessori Kids</label>
            <input type="text" id="setting-pass-crm-montessori" placeholder="montessori123">
        </div>
        <div class="fgroup">
            <label>Victory Colleges</label>
            <input type="text" id="setting-pass-crm-victory" placeholder="victory123">
        </div>
        <div class="fgroup">
            <label>Zümrüd İdman</label>
            <input type="text" id="setting-pass-crm-zumrud" placeholder="zumrud123">
        </div>

        <h4 style="color:#3b82f6; margin-top:20px; margin-bottom:10px; border-bottom:1px solid rgba(59,130,246,0.3); padding-bottom:5px;">Digər Modul Şifrələri</h4>
        <div class="fgroup">
            <label>HR PANEL Şifrəsi</label>
            <input type="text" id="setting-pass-hr" placeholder="hr123">
        </div>
        <div class="fgroup">
            <label>FİNANS PANEL Şifrəsi</label>
            <input type="text" id="setting-pass-finance" placeholder="fin123">
        </div>
        <div class="fgroup">
            <label>SAYT İDARƏETMƏ Şifrəsi</label>
            <input type="text" id="setting-pass-site" placeholder="site123">
        </div>
        <div class="fgroup">
            <label>İMTAHAN PANELİ Şifrəsi</label>
            <input type="text" id="setting-pass-exam" placeholder="exam123">
        </div>
        
        <button onclick="saveAdminPasswords()" style="width:100%; padding:14px;">Bütün Şifrələri Yadda Saxla</button>
        <div id="status"></div>
    </div>

    <script>
        const API_URL = 'https://evrika-api.yusifliqezenfer90.workers.dev/api';
        const API_KEY = 'sb_publishable_wePNIkpZ6n6dMLud4ODjAA_O9nxbkRE';
        const HEADERS = { 'apikey': API_KEY, 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' };

        let defaultModulePasswords = {
            'crm': 'crm123',
            'crm_lisey1': 'nerimanov123',
            'crm_lisey2': 'genclik123',
            'crm_montessori': 'montessori123',
            'crm_victory': 'victory123',
            'crm_zumrud': 'zumrud123',
            'hr': 'hr123',
            'finance': 'fin123',
            'site': 'site123',
            'exam': 'exam123'
        };
        let savedPass = localStorage.getItem('evrika_admin_passwords');
        let MODULE_PASSORDS = savedPass ? Object.assign({}, defaultModulePasswords, JSON.parse(savedPass)) : Object.assign({}, defaultModulePasswords);
        let _adminPassDbId = 6;

        function fillInputs() {
            document.getElementById('setting-pass-crm').value = MODULE_PASSORDS['crm'] || 'crm123';
            document.getElementById('setting-pass-crm-lisey1').value = MODULE_PASSORDS['crm_lisey1'] || 'nerimanov123';
            document.getElementById('setting-pass-crm-lisey2').value = MODULE_PASSORDS['crm_lisey2'] || 'genclik123';
            document.getElementById('setting-pass-crm-montessori').value = MODULE_PASSORDS['crm_montessori'] || 'montessori123';
            document.getElementById('setting-pass-crm-victory').value = MODULE_PASSORDS['crm_victory'] || 'victory123';
            document.getElementById('setting-pass-crm-zumrud').value = MODULE_PASSORDS['crm_zumrud'] || 'zumrud123';
            document.getElementById('setting-pass-hr').value = MODULE_PASSORDS['hr'] || 'hr123';
            document.getElementById('setting-pass-finance').value = MODULE_PASSORDS['finance'] || 'fin123';
            document.getElementById('setting-pass-site').value = MODULE_PASSORDS['site'] || 'site123';
            document.getElementById('setting-pass-exam').value = MODULE_PASSORDS['exam'] || 'exam123';
        }
        fillInputs();

        // Mərkəzi serverdən ən son şifrələri oxu
        async function syncAdminPasswordsFromCloud() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = 'Şifrələr serverdən sinxronlaşdırılır...';
            statusEl.style.color = '#38bdf8';
            try {
                const res = await fetch(`${API_URL}/parent_testimonials?select=*`, { headers: HEADERS, cache: 'no-store' });
                if (res.ok) {
                    const list = await res.json();
                    const rec = list.find(r => (r.payload && r.payload.__type__ === 'admin_system_passwords') || r.__type__ === 'admin_system_passwords');
                    if (rec) {
                        _adminPassDbId = rec.id || rec._db_id_ || 6;
                        const p = rec.payload || rec;
                        Object.keys(defaultModulePasswords).forEach(k => {
                            if (p[k]) MODULE_PASSORDS[k] = p[k];
                        });
                        localStorage.setItem('evrika_admin_passwords', JSON.stringify(MODULE_PASSORDS));
                        fillInputs();
                        statusEl.innerText = 'Ən son server şifrələri yükləndi.';
                        statusEl.style.color = '#10b981';
                        setTimeout(() => { statusEl.innerText = ''; }, 2500);
                    }
                }
            } catch (e) {
                console.warn("Could not sync passwords:", e);
                statusEl.innerText = '';
            }
        }
        syncAdminPasswordsFromCloud();

        async function saveAdminPasswords() {
            const statusEl = document.getElementById('status');
            MODULE_PASSORDS['crm'] = document.getElementById('setting-pass-crm').value || 'crm123';
            MODULE_PASSORDS['crm_lisey1'] = document.getElementById('setting-pass-crm-lisey1').value || 'nerimanov123';
            MODULE_PASSORDS['crm_lisey2'] = document.getElementById('setting-pass-crm-lisey2').value || 'genclik123';
            MODULE_PASSORDS['crm_montessori'] = document.getElementById('setting-pass-crm-montessori').value || 'montessori123';
            MODULE_PASSORDS['crm_victory'] = document.getElementById('setting-pass-crm-victory').value || 'victory123';
            MODULE_PASSORDS['crm_zumrud'] = document.getElementById('setting-pass-crm-zumrud').value || 'zumrud123';
            MODULE_PASSORDS['hr'] = document.getElementById('setting-pass-hr').value || 'hr123';
            MODULE_PASSORDS['finance'] = document.getElementById('setting-pass-finance').value || 'fin123';
            MODULE_PASSORDS['site'] = document.getElementById('setting-pass-site').value || 'site123';
            MODULE_PASSORDS['exam'] = document.getElementById('setting-pass-exam').value || 'exam123';

            // Lokal yaddaş
            localStorage.setItem('evrika_admin_passwords', JSON.stringify(MODULE_PASSORDS));
            statusEl.innerText = 'Serverə saxlanılır...';
            statusEl.style.color = '#38bdf8';

            // Mərkəzi serverə yaz (bütün brauzer və cihazlar üçün qalıcı)
            try {
                const payloadData = {
                    __type__: 'admin_system_passwords',
                    ...MODULE_PASSORDS,
                    updated_at: new Date().toISOString()
                };
                const updateUrl = `${API_URL}/parent_testimonials?id=eq.${_adminPassDbId}`;
                const putRes = await fetch(updateUrl, {
                    method: 'PUT',
                    headers: HEADERS,
                    body: JSON.stringify({ payload: payloadData })
                });

                if (!putRes.ok) {
                    const postRes = await fetch(`${API_URL}/parent_testimonials`, {
                        method: 'POST',
                        headers: HEADERS,
                        body: JSON.stringify({ payload: payloadData })
                    });
                    if (postRes.ok) {
                        const postData = await postRes.json();
                        if (postData.id) _adminPassDbId = postData.id;
                    }
                }
                statusEl.innerText = 'Bütün şifrələr mərkəzi serverdə uğurla yadda saxlanıldı!';
                statusEl.style.color = '#10b981';
                setTimeout(() => { statusEl.innerText = ''; }, 3000);
            } catch(e) {
                console.error("Save error:", e);
                statusEl.innerText = 'Lokal saxlanıldı, lakin serverdə xəta baş verdi.';
                statusEl.style.color = '#f59e0b';
            }
        }
    </script>
</body>
