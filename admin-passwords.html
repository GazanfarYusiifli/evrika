<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Evrika Admin Şifrələri</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; padding: 40px; background: #020617; color: white; }
        .fgroup { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #94a3b8; }
        input { padding: 10px; width: 100%; max-width: 300px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); font-size: 16px; color: white; outline: none; }
        button { padding: 12px 24px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        #status { margin-top: 20px; color: #10b981; font-weight: bold; }
        .container { max-width: 400px; margin: 0 auto; background: rgba(255,255,255,0.03); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-top: 0;">Admin Panel Şifrələri</h2>
        <div class="fgroup">
            <label>CRM & ANALİTİKA Şifrəsi</label>
            <input type="text" id="setting-pass-crm" placeholder="crm123">
        </div>
        <div class="fgroup">
            <label>HR PANEL Şifrəsi</label>
            <input type="text" id="setting-pass-hr" placeholder="hr123">
        </div>
        <div class="fgroup">
            <label>FİNANS PANEL Şifrəsi</label>
            <input type="text" id="setting-pass-finance" placeholder="fin123">
        </div>
        <div class="fgroup">
            <label>SAYT İDARƏETMƏ Şifrəsi</label>
            <input type="text" id="setting-pass-site" placeholder="site123">
        </div>
        <div class="fgroup">
            <label>İMTAHAN PANELİ Şifrəsi</label>
            <input type="text" id="setting-pass-exam" placeholder="exam123">
        </div>
        
        <button onclick="saveAdminPasswords()">Şifrələri Yadda Saxla</button>
        <div id="status"></div>
    </div>

    <script>
        let savedPass = localStorage.getItem('evrika_admin_passwords');
        let MODULE_PASSORDS = savedPass ? JSON.parse(savedPass) : { 'crm':'crm123', 'hr':'hr123', 'finance':'fin123', 'site':'site123', 'exam':'exam123' };

        document.getElementById('setting-pass-crm').value = MODULE_PASSORDS['crm'] || 'crm123';
        document.getElementById('setting-pass-hr').value = MODULE_PASSORDS['hr'] || 'hr123';
        document.getElementById('setting-pass-finance').value = MODULE_PASSORDS['finance'] || 'fin123';
        document.getElementById('setting-pass-site').value = MODULE_PASSORDS['site'] || 'site123';
        document.getElementById('setting-pass-exam').value = MODULE_PASSORDS['exam'] || 'exam123';

        function saveAdminPasswords() {
            MODULE_PASSORDS['crm'] = document.getElementById('setting-pass-crm').value || 'crm123';
            MODULE_PASSORDS['hr'] = document.getElementById('setting-pass-hr').value || 'hr123';
            MODULE_PASSORDS['finance'] = document.getElementById('setting-pass-finance').value || 'fin123';
            MODULE_PASSORDS['site'] = document.getElementById('setting-pass-site').value || 'site123';
            MODULE_PASSORDS['exam'] = document.getElementById('setting-pass-exam').value || 'exam123';
            localStorage.setItem('evrika_admin_passwords', JSON.stringify(MODULE_PASSORDS));
            document.getElementById('status').innerText = 'Şifrələr uğurla yadda saxlanıldı!';
            setTimeout(() => { document.getElementById('status').innerText = ''; }, 3000);
        }
    </script>
</body>
</html>
